<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apex Procurement AI - Document Viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #090d16;
      --surface: #111827;
      --card: #1f2937;
      --border: #374151;
      --text: #f9fafb;
      --text-muted: #9ca3af;
      --emerald: #10b981;
      --blue: #3b82f6;
      --font: 'Plus Jakarta Sans', sans-serif;
      --mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      line-height: 1.7;
      padding: 32px 24px;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
    }

    /* Top Nav */
    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #fff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.15s;
    }

    .btn-back:hover {
      background: var(--card);
      border-color: #60a5fa;
      color: #60a5fa;
    }

    .doc-pill {
      font-family: var(--mono);
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 9999px;
      background: rgba(59, 130, 246, 0.12);
      border: 1px solid rgba(59, 130, 246, 0.3);
      color: #60a5fa;
      font-weight: 600;
    }

    /* Markdown Content Styling */
    .markdown-body {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.3);
    }

    .markdown-body h1 {
      font-size: 28px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
      letter-spacing: -0.02em;
    }

    .markdown-body h2 {
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      margin-top: 32px;
      margin-bottom: 14px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(55, 65, 81, 0.5);
    }

    .markdown-body h3 {
      font-size: 17px;
      font-weight: 700;
      color: #93c5fd;
      margin-top: 24px;
      margin-bottom: 10px;
    }

    .markdown-body p {
      font-size: 15px;
      color: #d1d5db;
      margin-bottom: 16px;
    }

    .markdown-body ul, .markdown-body ol {
      padding-left: 24px;
      margin-bottom: 16px;
      font-size: 14.5px;
      color: #d1d5db;
    }

    .markdown-body li {
      margin-bottom: 8px;
    }

    .markdown-body strong {
      color: #fff;
    }

    .markdown-body code {
      font-family: var(--mono);
      font-size: 13px;
      background: rgba(31, 41, 55, 0.8);
      padding: 2px 6px;
      border-radius: 4px;
      color: #34d399;
      border: 1px solid rgba(55, 65, 81, 0.6);
    }

    .markdown-body pre {
      background: #0a0f1d;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 20px;
      overflow-x: auto;
      margin: 18px 0;
    }

    .markdown-body pre code {
      background: none;
      padding: 0;
      border: none;
      color: #93c5fd;
      font-size: 13px;
    }

    .markdown-body blockquote {
      border-left: 4px solid var(--blue);
      padding-left: 16px;
      margin: 18px 0;
      color: var(--text-muted);
      background: rgba(59, 130, 246, 0.05);
      padding: 12px 16px;
      border-radius: 0 8px 8px 0;
    }

    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 20px 0;
      font-size: 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    .markdown-body th {
      background: #1f2937;
      padding: 12px 16px;
      text-align: left;
      font-weight: 700;
      color: #fff;
      border-bottom: 1px solid var(--border);
    }

    .markdown-body td {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(55, 65, 81, 0.4);
      color: #d1d5db;
    }

    .markdown-body tr:hover td {
      background: rgba(31, 41, 55, 0.4);
    }

    .markdown-body hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 28px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-nav">
      <a href="index.html" class="btn-back">← Back to Main Hub</a>
      <span class="doc-pill" id="docName">Loading Document...</span>
    </div>

    <div class="markdown-body" id="content">
      <p style="color: var(--text-muted);">Fetching and rendering document...</p>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const docPath = urlParams.get('file') || 'reports/v1.1_hill_climbing_optimization.md';

    document.getElementById('docName').innerText = docPath.split('/').pop();

    fetch(docPath)
      .then(res => {
        if (!res.ok) throw new Error(`HTTP ${res.status}: Failed to load document`);
        return res.text();
      })
      .then(text => {
        document.getElementById('content').innerHTML = marked.parse(text);
      })
      .catch(err => {
        document.getElementById('content').innerHTML = `
          <h2 style="color: #f87171;">⚠️ Error Loading Document</h2>
          <p>${err.message}</p>
          <p>Please verify the file exists at <code>${docPath}</code>.</p>
        `;
      });
  </script>
</body>
</html>
